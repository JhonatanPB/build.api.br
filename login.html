<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="hero">

        <div class="login-box">

            <h1>Login</h1>

            <p class="login-subtitle">Entre para continuar</p>

           <form onsubmit="event.preventDefault(); validarLogin();">

    <input
        type="email"
        id="email"
        placeholder="E-mail:"
        required>

    <input
        type="password"
        id="senha"
        placeholder="Senha:"
        required>

    <button type="submit">
        Entrar
    </button>

</form>

            <div class="login-footer">
                Sem cadastro? 
                <a href="cadastro.html">Cadastre-se</a>
            </div>

        </div>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
