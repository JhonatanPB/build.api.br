<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

    <div class="sidebar" id="sidebar">
      <h4>BUILD</h4>


      <a href="aparencia.html" class="menu-btn"><i class="fa-solid fa-palette"></i> Aparência</a>
      <a href="info.html" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i>informações</a>
      <a href="dashboard.html" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
   
    </div>

   <div class="content">

    </div>

  </div>
    

    <script>
      (function(){
        const btn = document.querySelector('.menu-toggle');
        const sidebar = document.getElementById('sidebar');
        if(!btn || !sidebar) return;

        btn.addEventListener('click', () => {
          sidebar.classList.toggle('is-open');
        });

        document.addEventListener('click', (e) => {
          if(window.innerWidth > 900) return;
          if(!sidebar.classList.contains('is-open')) return;
          if(sidebar.contains(e.target) || btn.contains(e.target)) return;
          sidebar.classList.remove('is-open');
        });
      })();
    </script>
</body>
</html>
