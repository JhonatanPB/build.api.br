<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/alterar-senha.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Alterar Senha</title>
</head>
<body>
    <div class="hero">

        <div class="login-box">

            <h1>Alterar Senha</h1>
            <p class="login-subtitle">Insira sua nova senha</p>

            <form class="login-form">
                <input type="password" class="login-input" placeholder="Senha Atual" required>
                
                <input type="password" class="login-input" placeholder="Nova Senha" required>
                
                <input type="password" class="login-input" placeholder="Confirmar Nova Senha" required>
                
                <button type="submit">Alterar Senha</button>
            </form>

            <div class="login-help">
                <a href="config.html">Voltar</a>
            </div>

        </div>

    </div>
</body>
</html>
