<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <link rel="stylesheet" href="css/content-common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>



  <div class="container">

    <div class="sidebar" id="sidebar">
      <h2>BUILD</h2>
       <a href="notas.html" class="menu-btn"><i class="fa-regular fa-note-sticky"></i>Notas </a> 
       <a href="agenda.html" class="menu-btn"><i class="fa-regular fa-calendar"></i>Agenda</a>
       <a href="tarefas.html" class="menu-btn"><i class="fa-solid fa-list-check"></i>Tarefas</a>
       <a href="perfil.html" class="menu-btn"><i class="fa-regular fa-user"></i>Perfil</a>
       <a href="config.html" class="menu-btn"><i class="fa-solid fa-gear"></i>Configurações</a>
       <a href="login.html" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>

    </div>
  
   <div class="content">
      <div class="card">
        <h3>Dashboard</h3>
        <p>Bem-vindo(a)! Aqui vão aparecer seus dados. Por enquanto é um placeholder para você já ver o layout sem ficar branco.</p>
      </div>
    </div>

  </div>

  <script>
    (function(){
      const btn = document.querySelector('.menu-toggle');
      const sidebar = document.getElementById('sidebar');
      if(!btn || !sidebar) return;

      btn.addEventListener('click', () => {
        sidebar.classList.toggle('is-open');
      });

      // fecha ao clicar fora (mobile)
      document.addEventListener('click', (e) => {
        if(window.innerWidth > 900) return;
        if(!sidebar.classList.contains('is-open')) return;
        if(sidebar.contains(e.target) || btn.contains(e.target)) return;
        sidebar.classList.remove('is-open');
      });
    })();
  </script>
</body>
</html>
