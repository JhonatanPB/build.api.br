<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <link rel="stylesheet" href="css/content-common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>



  <div class="container">

    <div class="sidebar" id="sidebar">
      <h2>BUILD</h2>
       <a href="notas.html" class="menu-btn"><i class="fa-regular fa-note-sticky"></i>Notas </a> 
       <a href="agenda.html" class="menu-btn"><i class="fa-regular fa-calendar"></i>Agenda</a>
       <a href="tarefas.html" class="menu-btn"><i class="fa-solid fa-list-check"></i>Tarefas</a>
       
       <a href="config.html" class="menu-btn"><i class="fa-solid fa-gear"></i>Configurações</a>

    </div>
  
  <div class="content">

    <div class="top-bar">
      <div>
        <h1>Bem-vindo ao BUILD</h1>
        <p>Organize suas notas, tarefas e compromissos em um só lugar.</p>
      </div>

      <div class="relogio">
        <span id="data"></span>
        <span id="hora"></span>
      </div>
    </div>

   <div class="cards-grid">

    <div class="card">
        <h3>Notas</h3>
        <p class="card-info">Você tem <strong>2 notas</strong> guardadas.</p>
    </div>

    <div class="card">
        <h3>Agenda</h3>
        <p class="card-info"><strong>3 compromissos</strong> marcados para os próximos dias.</p>
    </div>

    <div class="card">
        <h3>Tarefas</h3>
        <p class="card-info">Existem <strong>5 tarefas</strong> pendentes na sua lista.</p>
    </div>

    <div class="card">
        <h3>Perfil</h3>
        <div class="status-container">
            <span class="status-dot"></span>
            <p class="card-info">Perfil ativo</p>
        </div>
    </div>

</div>

</div>
  
</script>
</body>
</html>
