<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <link rel="stylesheet" href="css/content-common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>



  <div class="container">

    <div class="sidebar" id="sidebar">
      <h2>BUILD</h2>
       <a href="notas.html" class="menu-btn"><i class="fa-regular fa-note-sticky"></i>Notas </a> 
       <a href="agenda.html" class="menu-btn"><i class="fa-regular fa-calendar"></i>Agenda</a>
       <a href="tarefas.html" class="menu-btn"><i class="fa-solid fa-list-check"></i>Tarefas</a>
       <a href="config.html" class="menu-btn"><i class="fa-solid fa-gear"></i>Configurações</a>
       <a href="login.html" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>

    </div>
  
   <div class="content">

    <div class="top-row">

        <div class="welcome-card">
            <h1>Dashboard</h1>

            <p>
                Bem-vindo ao Build. Organize suas tarefas,
                compromissos e anotações em um único lugar.
            </p>
        </div>

        <div class="date-column">

            <div class="mini-card">
                <span id="data"></span>
            </div>

            <div class="mini-card">
                <span id="hora"></span>
            </div>

        </div>

    </div>

    <div class="dashboard-grid">

        <div class="card">
            <h2>Notas</h2>
        </div>

        <div class="card">
            <h2>Agenda</h2>
        </div>

        <div class="card">
            <h2>Tarefas</h2>
        </div>

        <div class="card">
            <h2>Perfil</h2>
        </div>

    </div>

</div>
  <script>
function atualizarRelogio(){

    const agora = new Date();

    document.getElementById("data").textContent =
        agora.toLocaleDateString("pt-BR");

    document.getElementById("hora").textContent =
        agora.toLocaleTimeString("pt-BR");
}

atualizarRelogio();

setInterval(atualizarRelogio,1000);
</script>
</body>
</html>
