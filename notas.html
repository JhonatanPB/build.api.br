<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notas</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/notas.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <h3>BUILD</h3>

            <a href="notas.html" class="menu-btn">
                <i class="fa-regular fa-note-sticky"></i>
                Notas
            </a>

            <a href="agenda.html" class="menu-btn">
                <i class="fa-regular fa-calendar"></i>
                Agenda
            </a>

            <a href="tarefas.html" class="menu-btn">
                <i class="fa-solid fa-list-check"></i>
                Tarefas
            </a>

            <a href="perfil.html" class="menu-btn">
                <i class="fa-regular fa-user"></i>
                Perfil
            </a>

            <a href="dashboard.html" class="menu-btn logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
            </a>

        </div>

        <!-- CONTEÚDO -->
        <div class="content">

            <!-- TOPO -->
            <div class="top-bar">

                <div>
                    <h1>Notas</h1>
                    <p>Salve suas anotações rapidamente.</p>
                </div>

            </div>

            <!-- ÁREA DE NOTAS -->
            <div class="notes-area">

                <textarea
                    id="noteInput"
                    placeholder="Escreva sua anotação..."></textarea>

                <button
                    onclick="salvarNota()"
                    class="new-project">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Salvar anotação

                </button>

            </div>

            <!-- LISTA DAS NOTAS -->
            <div id="notesList"></div>

        </div>

    </div>

    <script src="js/notas.js"></script>

</body>

</html>
