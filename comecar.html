<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="hero">
      <h1>Login</h1>
      <p><strong> Entre para continuar</strong></p>

      <form class="login-form" onsubmit="event.preventDefault();">
        <input class="login-input" type="email" name="email" placeholder="E-mail" required />
        <input class="login-input" type="password" name="senha" placeholder="Senha" required />
        <button class="btn" type="button" onclick="window.location.href='dashboard.html';">Entrar</button>
      </form>


      <p class="login-help">Sem cadastro? Em breve você poderá criar conta.</p>
    </div>
  </header>
</body>
</html>
